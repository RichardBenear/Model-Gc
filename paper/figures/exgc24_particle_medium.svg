<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="1020" height="660">
  <title>Model Gc: hypothesized particle–medium composite</title>
  <desc>Conceptual schematic, not simulation data: a particle core with a surrounding coupled G medium, inward flux arrows and a rightward motion arrow. The knot icon denotes the earlier topological-particle concept, not a knot in EX-GC23.</desc>
  <defs>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#5386c5" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#5386c5" stop-opacity=".025"/>
    </radialGradient>
    <radialGradient id="core">
      <stop offset="0%" stop-color="#ffda75"/>
      <stop offset="65%" stop-color="#edac4a"/>
      <stop offset="100%" stop-color="#c66a31"/>
    </radialGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#528bc7"/></marker>
    <marker id="velocity" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#299365"/></marker>
  </defs>
  <rect width="340" height="220" fill="white"/>
  <ellipse cx="158" cy="98" rx="119" ry="77" fill="url(#halo)"/>
  <g fill="none" stroke="#5386c5" stroke-opacity=".45" stroke-width=".8" stroke-dasharray="3 3">
    <ellipse cx="155" cy="98" rx="56.25" ry="36"/>
    <ellipse cx="155" cy="98" rx="81.25" ry="52"/>
    <ellipse cx="155" cy="98" rx="106.25" ry="68"/>
  </g>
  <g stroke="#528bc7" fill="none" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M64 65 Q104 45 138 72"/>
    <path d="M62 132 Q105 151 138 122"/>
    <path d="M177 40 Q170 63 165 73"/>
    <path d="M177 156 Q170 134 165 123"/>
    <path d="M250 70 Q218 61 183 81"/>
    <path d="M250 129 Q218 138 183 116"/>
  </g>
  <circle cx="157" cy="98" r="29" fill="url(#core)" stroke="#b77937"/>
  <path d="M146 83 C184 79 128 119 160 115 C191 105 139 76 143 103 C147 125 188 88 146 83 Z" fill="none" stroke="#fff4c5" stroke-width="2.5"/>
  <path d="M199 98 L284 98" stroke="#299365" stroke-width="3" marker-end="url(#velocity)"/>
  <g font-family="Arial, Liberation Sans, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937">
    <text x="242" y="87" fill="#299365">Motion</text>
    <path d="M157 130 L157 180" stroke="#1f2937" stroke-opacity=".6"/>
    <text x="157" y="194">Particle core</text>
    <text x="155" y="13">Coupled G medium</text>
    <text x="170" y="214" font-size="10" opacity=".65">Hypothesized particle–medium composite</text>
  </g>
</svg>
